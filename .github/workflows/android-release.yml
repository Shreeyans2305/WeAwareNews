name: Android APK release

on:
  push:
    branches: [master]
    paths:
      - 'mobile/android_flutter/**'
      - 'mobile/scripts/check_config.py'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'mobile/android_flutter/**'
      - 'mobile/scripts/check_config.py'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/android_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Check tracked mobile configuration
        working-directory: .
        run: python3 mobile/scripts/check_config.py
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Only trusted default-branch runs receive Firebase and the stable test key.
      - name: Restore account configuration and test signing certificate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          config = os.environ['GOOGLE_SERVICES_JSON']
          key = os.environ['KEYSTORE_BASE64']
          if not config or not key:
              raise SystemExit('Missing Android Firebase or test signing repository secret')
          json.loads(config)
          pathlib.Path('android/app/google-services.json').write_text(config)
          target = pathlib.Path.home() / '.android/debug.keystore'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(key, validate=True))
          target.chmod(0o600)
          PY
      - name: Build universal APK
        run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 1000))
      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/WeAware-Android.apk
          cd dist
          sha256sum WeAware-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android_flutter/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove private build inputs
        if: always()
        run: |
          rm -f android/app/google-services.json "$HOME/.android/debug.keystore"

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Publish Android preview in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tag="android-build-$BUILD_NUMBER"
          cat > release-notes.md <<EOF
          Install **WeAware-Android.apk** on an Android device to test this build.

          Built from commit $COMMIT. Analysis and Flutter tests passed before packaging.
          This is a preview build signed with the existing Android test certificate; Firebase and Google sign-in are configured. It is not a Play Store production release.
          SHA256SUMS.txt contains the APK checksum.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$COMMIT" \
              --title "Android preview #$BUILD_NUMBER" --prerelease --latest=false \
              --notes-file release-notes.md
          fi
