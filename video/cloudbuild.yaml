# Cloud Build configuration for WeAware Video images
# Usage:
#   Manual build:  gcloud builds submit --config=video/cloudbuild.yaml .
#
# Builds images tagged with $BUILD_ID

steps:
  # 1. Build weaware-video-api (lean, without ffmpeg)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weaware-repo/weaware-video-api:$BUILD_ID'
      - '-f'
      - 'video/Dockerfile.api'
      - '.'

  # 2. Build weaware-video-job (with ffmpeg)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/weaware-repo/weaware-video-job:$BUILD_ID'
      - '-f'
      - 'video/Dockerfile.job'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/weaware-repo/weaware-video-api:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/weaware-repo/weaware-video-job:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
