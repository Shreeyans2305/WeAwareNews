# WeAware News - Studio Set & Anchor Registry
version: "1.0"

set:
  id: "studio_main"
  name: "WeAware News Studio"
  description: >-
    Broadcast newsroom television studio with warm curved anchor desk, soft professional studio lighting,
    blurred newsroom background with monitors through glass in the deep background, sleek modern desk microphones,
    broadcast television lighting, vertical 9:16 framing, quiet room tone, no audience, no crowd.
  reference_image_gcs_uri: "gs://{bucket}/assets/sets/studio_main.png"

anchors:
  - id: "marcus"
    name: "Marcus Vance"
    role: "Lead Anchor"
    description: >-
      Professional television news anchor in his late 30s with neatly styled dark hair, clean-shaven,
      wearing professional business attire: tailored navy wool suit jacket, crisp light blue dress shirt and conservative tie.
      Upright posture, neutral serious expression, steady news-desk eye contact directly into the lens,
      minimal and measured hand gestures, no smirking, no winking, no exaggerated head movement.
    voice_description: >-
      Mid-Atlantic baritone, crisp broadcast articulation, calm measured delivery, neutral news cadence.
    framings:
      medium: "gs://{bucket}/assets/anchors/marcus_medium.png"
      wide: "gs://{bucket}/assets/anchors/marcus_wide.png"

  - id: "maya"
    name: "Maya Lin"
    role: "Co-Anchor"
    description: >-
      Professional television news anchor and journalist in her early 30s with shoulder-length sleek dark hair,
      wearing professional business attire: tailored plum blazer over a dark silk dress shirt.
      Upright posture, neutral serious expression, seated at the news desk, steady news-desk eye contact with camera,
      minimal and measured gestures, no smirking, no winking, no exaggerated head movement.
    voice_description: >-
      Clear mezzo-soprano, articulate professional broadcast delivery, calm neutral news cadence.
    framings:
      medium: "gs://{bucket}/assets/anchors/maya_medium_cool_studio_v3_safe.png"
      wide: "gs://{bucket}/assets/anchors/maya_wide.png"
