timeout: '14400s'
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    dir: 'backend'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=weaware-env > .env
  - name: 'python:3.9'
    entrypoint: 'bash'
    dir: 'backend'
    args:
      - '-c'
      - |
        echo "[$(date -u)] Downloading cloud-sql-proxy..."
        wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
        chmod +x cloud-sql-proxy
        
        echo "[$(date -u)] Starting cloud-sql-proxy in background..."
        ./cloud-sql-proxy weaware:us-central1:weaware-pg --port=5433 &
        sleep 5
        
        echo "[$(date -u)] Installing Python dependencies..."
        pip install -r requirements.txt
        
        echo "[$(date -u)] Downloading spaCy model..."
        python -m spacy download xx_ent_wiki_sm

        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 1: Collecting News (run_stage1)..."
        echo "[$(date -u)] ======================================"
        python -m ingestion.run_stage1

        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 2: Clustering (recluster.py)..."
        echo "[$(date -u)] ======================================"
        python recluster.py

        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 3: Checking False Merges (fix_clusters.py)..."
        echo "[$(date -u)] ======================================"
        python fix_clusters.py

        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 4: Updating DB (sync_to_postgres.py)..."
        echo "[$(date -u)] ======================================"
        python sync_to_postgres.py --full

        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 5: Generating reviewed articles (Gemini)..."
        echo "[$(date -u)] ======================================"
        python -m editorial.pipeline
        
        echo "[$(date -u)] ======================================"
        echo "[$(date -u)] STEP 6: Cleaning up proxy..."
        echo "[$(date -u)] ======================================"
        pkill cloud-sql-proxy || true
        
        echo "[$(date -u)] Pipeline completed successfully!"
    env:
      - 'GOOGLE_CLOUD_PROJECT=weaware'
      - 'GOOGLE_CLOUD_LOCATION=global'
      - 'WEAWARE_GEMINI_BUDGET_USD=10'
      - 'WEAWARE_GEMINI_MODEL=gemini-3.8-flash'
      - 'WEAWARE_GEMINI_INPUT_USD_PER_MILLION=1.50'
      - 'WEAWARE_GEMINI_OUTPUT_USD_PER_MILLION=7.50'
      - 'WEAWARE_GEMINI_THINKING_USD_PER_MILLION=7.50'
      - 'DB_HOST=127.0.0.1'
      - 'DB_PORT=5433'
      - 'PYTHONUNBUFFERED=1'

options:
  logging: CLOUD_LOGGING_ONLY
